<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Bookalorian Designs merch: a t-shirt, tote bag and mug" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glowA" cx="30%" cy="28%" r="55%">
      <stop offset="0" stop-color="#ff2d8a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2d8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="78%" cy="80%" r="50%">
      <stop offset="0" stop-color="#c2187a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c2187a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1420"/>
      <stop offset="1" stop-color="#170b12"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#120a0f"/>
  <rect width="400" height="400" fill="url(#glowA)"/>
  <rect width="400" height="400" fill="url(#glowB)"/>

  <!-- sparkle dots -->
  <g fill="#ff7ab8" opacity="0.7">
    <circle cx="60" cy="70" r="2"/><circle cx="340" cy="60" r="2.5"/><circle cx="352" cy="150" r="1.5"/>
    <circle cx="44" cy="330" r="2"/><circle cx="210" cy="40" r="1.5"/><circle cx="300" cy="352" r="1.5"/>
  </g>

  <!-- tote bag (back left) -->
  <g transform="rotate(-10 92 250)">
    <path d="M70 192 Q70 150 98 150 Q126 150 126 192" fill="none" stroke="#f6e9df" stroke-width="5" stroke-linecap="round"/>
    <rect x="45" y="188" width="106" height="124" rx="8" fill="#1c0e16" stroke="#ff2d8a" stroke-width="4"/>
    <path d="M98 236 l7 -6 a7 7 0 0 1 10 10 l-17 16 l-17 -16 a7 7 0 0 1 10 -10 z" fill="#ff2d8a"/>
    <path d="M66 280 h64 M74 292 h48" stroke="#f6e9df" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- mug (back right) -->
  <g transform="rotate(8 320 270)">
    <path d="M300 205 q-6 -10 0 -20 q6 -10 0 -20 M322 205 q-6 -10 0 -20 q6 -10 0 -20" fill="none" stroke="#f6e9df" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M352 236 q26 0 26 24 q0 24 -26 24" fill="none" stroke="#ff2d8a" stroke-width="7"/>
    <rect x="282" y="218" width="72" height="86" rx="10" fill="#1c0e16" stroke="#ff2d8a" stroke-width="4"/>
    <path d="M300 250 q9 -5 18 1 q9 -6 18 -1 v22 q-9 -5 -18 1 q-9 -6 -18 -1 z" fill="none" stroke="#f6e9df" stroke-width="3" stroke-linejoin="round"/>
    <path d="M318 251 v22" stroke="#f6e9df" stroke-width="2.5"/>
  </g>

  <!-- t-shirt (front) -->
  <g transform="translate(200 214) scale(0.82) translate(-200 -214)">
    <path d="M150 112 L116 124 L76 160 L102 196 L126 182 L126 312 L274 312 L274 182 L298 196 L324 160 L284 124 L250 112 Q200 146 150 112 Z"
          fill="#ff2d8a" opacity="0.35" filter="url(#soft)"/>
    <path d="M150 112 L116 124 L76 160 L102 196 L126 182 L126 312 L274 312 L274 182 L298 196 L324 160 L284 124 L250 112 Q200 146 150 112 Z"
          fill="url(#shirt)" stroke="#f6e9df" stroke-width="5" stroke-linejoin="round"/>
    <!-- open book print -->
    <path d="M160 214 Q180 202 200 214 Q220 202 240 214 L240 262 Q220 250 200 262 Q180 250 160 262 Z"
          fill="#ff2d8a" stroke="#f6e9df" stroke-width="4" stroke-linejoin="round"/>
    <path d="M200 214 V262" stroke="#f6e9df" stroke-width="4"/>
    <path d="M170 226 q12 -6 22 0 M170 238 q12 -6 22 0 M208 226 q12 -6 22 0 M208 238 q12 -6 22 0" fill="none" stroke="#f6e9df" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <!-- lips -->
    <path d="M186 284 q7 -8 14 -2 q7 -6 14 2 q-7 10 -14 10 q-7 0 -14 -10 z" fill="#ff2d8a" stroke="#f6e9df" stroke-width="2"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
