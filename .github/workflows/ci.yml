name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Check server and episode code
        run: |
          node --check server.js
          node --check api/episodes.js
          node --check episodes.js
          node --check analytics.js
          node --check services.js
          node --check api/booking.js

      - name: Test the episode feed reader
        run: npm test

      - name: Check pages, links, files and menu
        run: npm run check

      - name: Validate HTML
        run: npx --yes html-validate@9 "*.html"
